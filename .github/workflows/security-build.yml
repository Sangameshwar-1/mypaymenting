name: Validate PIN access implementation

on:
  push:
    branches: [feature/secure-pin-access]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check functions/index.js
          node --check scripts/create-pin-credentials.js
          node --check scripts/migrate-ledgers.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('functions/package.json', 'utf8'))"
