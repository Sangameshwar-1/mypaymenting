name: Validate PIN access code

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/preserve-existing-ledger-data"]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloud Functions syntax
        run: node --check functions/index.js
      - name: Check browser JavaScript module syntax
        run: |
          node --input-type=module --check < firebase.js
          node --input-type=module --check < login.js
          node --input-type=module --check < app.js
          node --input-type=module --check < person.js
      - name: Validate JSON configuration
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json', 'utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('database.rules.json', 'utf8'))"
